# Apenas testes. Nao substitua a instancia postgres-main na Oracle.
services:
  db-lab:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Informe_LOCAL_DB_PASSWORD}
    volumes:
      - gaq_jobs_lab:/var/lib/postgresql
      - ./db/000_jobs_whodb.sql:/docker-entrypoint-initdb.d/00_jobs.sql:ro
      - ./db/010_dictionary_whodb.sql:/docker-entrypoint-initdb.d/01_dictionary.sql:ro
      - ./db/020_status_v2_whodb.sql:/docker-entrypoint-initdb.d/02_status.sql:ro
      - ./db/030_comprovante_inscrito_whodb.sql:/docker-entrypoint-initdb.d/02b_comprovante.sql:ro
      - ./db/001_auth_whodb.sql:/docker-entrypoint-initdb.d/03_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaq"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  gaq_jobs_lab:
