# Aplicacao web usa o PostgreSQL gaq ja existente. Nenhum DB e criado aqui.
services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure_DATABASE_URL}
      APP_ORIGIN: ${APP_ORIGIN:?Configure_APP_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET:?Configure_SESSION_SECRET}
      COOKIE_SECURE: "true"
      SESSION_HOURS: ${SESSION_HOURS:-72}
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
    expose:
      - "80"

networks:
  coolify:
    external: true
